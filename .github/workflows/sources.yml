# Daily check that every external data source still answers in the shape the app expects.
# A failing run means a provider changed something; GitHub mails the repository owner.
name: Data sources
on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC, before the morning bulletin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_sources.py
